services:
  - type: web
    name: discord-bot-pana
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p bin
      if [ ! -f bin/ffmpeg ]; then
        curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
        tar -xf ffmpeg.tar.xz
        mv ffmpeg-*-static/ffmpeg bin/
        mv ffmpeg-*-static/ffprobe bin/
        rm -rf ffmpeg.tar.xz ffmpeg-*-static
        chmod +x bin/ffmpeg bin/ffprobe
      fi
      if [ ! -f bin/deno ]; then
        curl -fsSL https://deno.land/install.sh | DENO_INSTALL=./deno-install sh
        mv ./deno-install/bin/deno bin/
        rm -rf ./deno-install
        chmod +x bin/deno
      fi
    startCommand: PATH="$(pwd)/bin:$PATH" python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: COOKIES_FILE
        value: /etc/secrets/cookiesYT.txt
      - key: LAVALINK_URI
        value: http://lavalink.jirayu.net:13592
      - key: LAVALINK_PASSWORD
        value: youshallnotpass
      - key: PYTHON_VERSION
        value: 3.11.0
